<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fayllar</title>

<style>
html, body {
  background: #000 !important;
  margin: 0;
  padding: 0;
}

body {
  padding: 20px;
  font-family: Arial, sans-serif;
  color: white;
  text-align: center;
}

.dark-bg {
  background: #000;
  min-height: 100vh;
}

h1 {
  margin-bottom: 20px;
  opacity: 0;
  animation: fadeInDown 1s forwards;
  font-size: 22px;
}

.buttons {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 15px;
}

button.button {
  display: inline-block;
  padding: 15px 30px;
  border-radius: 50px;
  font-size: 18px;
  color: white;
  text-decoration: none;
  font-weight: bold;
  position: relative;
  overflow: hidden;
  border: 2px solid transparent;
  transition: all 0.3s ease;
  cursor: pointer;
  opacity: 0;
  transform: translateY(20px);
  animation: fadeInUp 0.8s forwards;
  font-family: inherit;
}

button.button::after {
  content: "";
  position: absolute;
  top: -50%;
  left: -60%;
  width: 30%;
  height: 200%;
  background: rgba(255,255,255,0.35);
  transform: rotate(25deg);
  animation: starSweep 3.2s ease-in-out infinite;
  pointer-events: none;
}
@keyframes starSweep {
  0% { left: -60%; }
  50% { left: 130%; }
  100% { left: 130%; }
}

button.button:hover {
  box-shadow: 0 0 15px rgba(255,255,255,0.5),
              0 0 30px rgba(255,255,255,0.3);
  transform: translateY(-5px) scale(1.05);
  filter: brightness(1.3);
}

.socials {
  margin-top: 40px;
  padding-top: 25px;
  border-top: 1px solid #2a2a2a;
}

.socials-title {
  font-size: 18px;
  margin-bottom: 18px;
  color: #ddd;
}

.social-buttons {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 15px;
}

.social-btn {
  display: inline-flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 16px 24px;
  border-radius: 20px;
  font-size: 14px;
  color: white;
  text-decoration: none;
  font-weight: bold;
  transition: all 0.3s ease;
}

.social-btn svg {
  width: 30px;
  height: 30px;
}

.social-btn:hover {
  box-shadow: 0 0 15px rgba(255,255,255,0.5),
              0 0 30px rgba(255,255,255,0.3);
  transform: translateY(-4px) scale(1.05);
  filter: brightness(1.3);
}

.social-yt { background: #ff0000; }
.social-tg { background: #0088cc; }
.social-ig { background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); }

@keyframes fadeInUp {
  from{opacity:0;transform:translateY(20px)}
  to{opacity:1;transform:translateY(0)}
}
@keyframes fadeInDown {
  from{opacity:0;transform:translateY(-20px)}
  to{opacity:1;transform:translateY(0)}
}

.snow {
  position: fixed;
  top: -10px;
  color: white;
  pointer-events: none;
  z-index: 9999;
  animation: snowFall linear infinite;
}
@keyframes snowFall {
  to { transform: translateY(110vh); }
}

/* ===== MODAL ===== */
.overlay {
  display: none;
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: rgba(0,0,0,0.75);
  z-index: 10000;
  justify-content: center;
  align-items: center;
}
.overlay.active { display: flex; }

.modal {
  background: #17181c;
  border: 1px solid #333;
  border-radius: 16px;
  padding: 25px 20px;
  width: 85%;
  max-width: 320px;
  text-align: center;
  animation: fadeInUp 0.25s forwards;
}
.modal h3 {
  margin: 0 0 18px 0;
  font-size: 17px;
  color: #fff;
}
.modal .opt {
  display: block;
  width: 100%;
  box-sizing: border-box;
  padding: 13px;
  margin-bottom: 10px;
  border-radius: 10px;
  border: none;
  font-size: 15px;
  font-weight: bold;
  color: #fff;
  text-decoration: none;
  cursor: pointer;
}
.modal .opt-bot { background: #0088cc; }
.modal .opt-site { background: #2ed573; }
.modal .opt-close {
  background: transparent;
  color: #999;
  font-weight: normal;
  margin-top: 4px;
  margin-bottom: 0;
}

/* ===== ADMIN PANEL ===== */
.admin-toggle {
  position: fixed;
  bottom: 20px;
  right: 20px;
  width: 48px;
  height: 48px;
  border-radius: 50%;
  background: #1c1c1c;
  border: 1px solid #444;
  color: #fff;
  font-size: 20px;
  cursor: pointer;
  z-index: 10001;
  box-shadow: 0 2px 8px rgba(0,0,0,.5);
}
.admin-input {
  display: block;
  width: 100%;
  box-sizing: border-box;
  padding: 11px;
  margin-bottom: 10px;
  border-radius: 8px;
  border: 1px solid #333;
  background: #111;
  color: #fff;
  font-size: 14px;
}
input[type=color].admin-input { padding: 4px; height: 44px; cursor: pointer; }
.admin-note { color: #888; font-size: 12px; margin: 0 0 12px; }
.admin-list-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 6px 0;
  border-bottom: 1px solid #2a2a2a;
  font-size: 14px;
  text-align: left;
}
.admin-del-btn { background: transparent; border: none; color: #e74c3c; font-size: 16px; cursor: pointer; }
.admin-hr { border: none; border-top: 1px solid #2a2a2a; margin: 14px 0; }
.admin-manage-list { max-height: 220px; overflow-y: auto; margin-bottom: 12px; text-align: left; }
.admin-row-controls { display: flex; gap: 6px; align-items: center; flex-shrink: 0; }
.admin-move-btn {
  background: #222;
  border: 1px solid #3a3a3a;
  color: #fff;
  width: 26px;
  height: 26px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 13px;
  line-height: 1;
}
.admin-move-btn:disabled { opacity: .3; cursor: default; }
</style>
</head>

<body>

<div class="dark-bg">

<h1>Fayllar roʻyxati — kerakli boʻlimni tanlang</h1>

<div class="buttons" id="buttons">
  <!-- Tugmalar Firebase (yoki localStorage) maʼlumotlaridan JavaScript orqali chiqariladi -->
</div>

<div class="socials">
  <h2 class="socials-title">Bizni kuzatib boring</h2>
  <div class="social-buttons">
    <a class="social-btn social-tg" href="#" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="white"><path d="M23.9 3.6L20.3 20c-.3 1.2-1 1.5-2 .9l-5.6-4.1-2.7 2.6c-.3.3-.6.6-1.1.6l.4-5.7L19.6 5.6c.5-.4-.1-.6-.7-.3L6 13.6.9 12c-1.1-.3-1.1-1.1.2-1.6L22.5 2c.9-.4 1.7.2 1.4 1.6z"/></svg>
      Telegram kanal
    </a>
    <a class="social-btn social-ig" href="#" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="white"><path d="M12 2.2c3.2 0 3.6 0 4.9.1 1.2.1 2 .3 2.4.5.6.2 1 .5 1.5 1 .5.5.7.9 1 1.5.2.4.4 1.2.5 2.4.1 1.3.1 1.7.1 4.9s0 3.6-.1 4.9c-.1 1.2-.3 2-.5 2.4-.2.6-.5 1-1 1.5-.5.5-.9.7-1.5 1-.4.2-1.2.4-2.4.5-1.3.1-1.7.1-4.9.1s-3.6 0-4.9-.1c-1.2-.1-2-.3-2.4-.5-.6-.2-1-.5-1.5-1-.5-.5-.7-.9-1-1.5-.2-.4-.4-1.2-.5-2.4-.1-1.3-.1-1.7-.1-4.9s0-3.6.1-4.9c.1-1.2.3-2 .5-2.4.2-.6.5-1 1-1.5.5-.5.9-.7 1.5-1 .4-.2 1.2-.4 2.4-.5 1.3-.1 1.7-.1 4.9-.1zM12 0C8.7 0 8.3 0 7 .1c-1.3.1-2.2.3-3 .6-.8.3-1.5.7-2.2 1.4C1.1 2.8.7 3.5.4 4.3c-.3.8-.5 1.7-.6 3C-.2 8.6-.2 9-.2 12.3s0 3.7.1 5c.1 1.3.3 2.2.6 3 .3.8.7 1.5 1.4 2.2.7.7 1.4 1.1 2.2 1.4.8.3 1.7.5 3 .6 1.3.1 1.7.1 5 .1s3.7 0 5-.1c1.3-.1 2.2-.3 3-.6.8-.3 1.5-.7 2.2-1.4.7-.7 1.1-1.4 1.4-2.2.3-.8.5-1.7.6-3 .1-1.3.1-1.7.1-5s0-3.7-.1-5c-.1-1.3-.3-2.2-.6-3-.3-.8-.7-1.5-1.4-2.2-.7-.7-1.4-1.1-2.2-1.4-.8-.3-1.7-.5-3-.6C15.7 0 15.3 0 12 0zm0 5.8a6.2 6.2 0 100 12.4 6.2 6.2 0 000-12.4zm0 10.2a4 4 0 110-8 4 4 0 010 8zm6.4-10.4a1.4 1.4 0 11-2.8 0 1.4 1.4 0 012.8 0z"/></svg>
      Instagram
    </a>
  </div>
</div>

</div>

<!-- MODAL -->
<div class="overlay" id="overlay">
  <div class="modal">
    <h3 id="modalTitle">Yuklab olish usulini tanlang</h3>
    <a href="#" id="optBot" class="opt opt-bot" target="_blank" rel="noopener">🤖 Bot orqali yuklash</a>
    <a href="#" id="optSite" class="opt opt-site" target="_blank" rel="noopener">🌐 Saytdan yuklash</a>
    <button class="opt opt-close" id="optClose">Bekor qilish</button>
  </div>
</div>

<!-- ADMIN PANEL -->
<button id="adminToggleBtn" class="admin-toggle" title="Admin panel">⚙️</button>
<div class="overlay" id="adminOverlay">
  <div class="modal">
    <h3>Admin panel</h3>

    <div id="adminLoginBox">
      <input type="password" id="adminPassInput" class="admin-input" placeholder="Parolni kiriting">
      <button type="button" class="opt opt-site" id="adminLoginBtn">Kirish</button>
      <button class="opt opt-close" id="adminCancelBtn">Bekor qilish</button>
    </div>

    <div id="adminFormBox" style="display:none">
      <p class="admin-note" id="firebaseStatusNote">Ulanish holati tekshirilmoqda...</p>
      <input type="text" id="newBtnName" class="admin-input" placeholder="Tugma nomi">
      <input type="text" id="newBtnBot" class="admin-input" placeholder="Bot havolasi (ixtiyoriy)">
      <input type="text" id="newBtnSite" class="admin-input" placeholder="Sayt havolasi (ixtiyoriy)">
      <input type="color" id="newBtnColor" class="admin-input" value="#3742fa">
      <button type="button" class="opt opt-site" id="addBtnSubmit">➕ Tugma qoʻshish</button>
      <hr class="admin-hr">
      <p class="admin-note">Barcha tugmalar — tahrirlash ✏️, joyini oʻzgartirish ↑↓ yoki oʻchirish 🗑:</p>
      <div id="manageBtnList" class="admin-manage-list"></div>
      <button class="opt opt-close" id="adminCloseBtn">Yopish</button>
    </div>
  </div>
</div>

<!-- Firebase SDK (real vaqtli, hammaga umumiy maʼlumotlar bazasi uchun) -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<script>
/* ====== FIREBASE ULANISH ======
   Bu yerga oʻzingizning Firebase loyihangiz maʼlumotlarini qoʻying:
   1) https://console.firebase.google.com ga kiring, "Add project" bilan yangi loyiha yarating
   2) Chap menyudan "Build" -> "Realtime Database" -> "Create Database" (test mode)
   3) "Project settings" (tishli gʻildirak) -> pastda "Your apps" -> "</>" (Web) belgisini bosib ilova qoʻshing
   4) Chiqqan firebaseConfig obyektidagi qiymatlarni pastdagi joylarga koʻchiring */
const firebaseConfig = {
  apiKey: "AIzaSyBtDFiza0VKGnfjK-9kh_J-UQ3-u0Fr3E8",
  authDomain: "gen-lang-client-0972589808.firebaseapp.com",
  databaseURL: "https://gen-lang-client-0972589808-default-rtdb.firebaseio.com",
  projectId: "gen-lang-client-0972589808",
  storageBucket: "gen-lang-client-0972589808.firebasestorage.app",
  messagingSenderId: "970439926854",
  appId: "1:970439926854:web:826fb07f8fdd021596d647"
};

let dbRef = null;
let firebaseReady = false;
try {
  if (firebaseConfig.apiKey && window.firebase) {
    firebase.initializeApp(firebaseConfig);
    dbRef = firebase.database().ref('buttons');
    firebaseReady = true;
  }
} catch(e){ console.error('Firebase ulanmadi:', e); }

const overlay = document.getElementById('overlay');
const modalTitle = document.getElementById('modalTitle');
const optBot = document.getElementById('optBot');
const optSite = document.getElementById('optSite');
const optClose = document.getElementById('optClose');
const buttonsContainer = document.getElementById('buttons');

/* Bosilganda tovush chiqarish */
let audioCtx;
function playClickSound(){
  try{
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(700, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(300, audioCtx.currentTime + 0.12);
    gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.15);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.15);
  }catch(e){}
}
document.addEventListener('click', (e) => {
  if (e.target.closest('.button, .social-btn, .opt')) playClickSound();
});

/* Tugma bosilganda yuklab olish modalini ochish (delegatsiya orqali) */
buttonsContainer.addEventListener('click', (e) => {
  const btn = e.target.closest('.button');
  if (!btn) return;
  const name = btn.dataset.name || '';
  const bot = btn.dataset.bot || '#';
  const site = btn.dataset.site || '#';

  modalTitle.textContent = name ? (name + ' — yuklab olish usuli') : 'Yuklab olish usulini tanlang';
  optBot.href = bot;
  optSite.href = site;
  overlay.classList.add('active');
});

optClose.addEventListener('click', () => overlay.classList.remove('active'));
overlay.addEventListener('click', (e) => {
  if (e.target === overlay) overlay.classList.remove('active');
});

/* ===== TUGMALAR ROʻYXATI =====
   Bu yerga oʻzingizning tugmalaringizni qoʻyishingiz mumkin (yoki admin paneldan qoʻshing).
   Har bir element: id, name, bot (ixtiyoriy), site (ixtiyoriy), color */
const DEFAULT_BUTTONS = [
  { id: "b1", name: "Namuna tugma 1", bot: "#", site: "#", color: "#3742fa" },
  { id: "b2", name: "Namuna tugma 2", bot: "#", site: "#", color: "#2ed573" }
];
let currentButtons = [];

function renderAllButtons(list){
  currentButtons = Array.isArray(list) ? list : [];
  buttonsContainer.innerHTML = '';
  currentButtons.forEach(data => {
    const b = document.createElement('button');
    b.className = 'button';
    b.style.background = data.color || '#3742fa';
    b.dataset.name = data.name;
    b.dataset.bot = data.bot || '#';
    b.dataset.site = data.site || '#';
    b.dataset.btnId = data.id;
    b.textContent = data.name;
    buttonsContainer.appendChild(b);
  });
  if (adminFormBox.style.display === 'block') renderManageList();
}

function saveButtons(list){
  if (firebaseReady){
    dbRef.set(list);
  } else {
    try { localStorage.setItem('buttonsData', JSON.stringify(list)); } catch(e){}
    renderAllButtons(list);
  }
}

function initButtons(){
  if (firebaseReady){
    dbRef.once('value').then(snap => {
      if (!snap.exists()) dbRef.set(DEFAULT_BUTTONS);
    });
    dbRef.on('value', snap => renderAllButtons(snap.val()));
  } else {
    let list;
    try { list = JSON.parse(localStorage.getItem('buttonsData')); } catch(e){ list = null; }
    renderAllButtons(list && list.length ? list : DEFAULT_BUTTONS);
  }
}

/* ===== ADMIN PANEL =====
   Standart parol: admin123
   Yangi parol oʻrnatish uchun brauzer konsolida hashStr("yangiParolingiz") ni ishga tushiring
   va natijani pastdagi ADMIN_PASSWORD_HASH ga qoʻying. */
function hashStr(str){
  let h = 5381;
  for (let i = 0; i < str.length; i++){
    h = ((h << 5) + h) + str.charCodeAt(i);
    h = h & h;
  }
  return (h >>> 0).toString(16);
}
const ADMIN_PASSWORD_HASH = hashStr("admin123");

const adminOverlay = document.getElementById('adminOverlay');
const adminToggleBtn = document.getElementById('adminToggleBtn');
const adminLoginBox = document.getElementById('adminLoginBox');
const adminFormBox = document.getElementById('adminFormBox');
const adminPassInput = document.getElementById('adminPassInput');
const adminLoginBtn = document.getElementById('adminLoginBtn');
const adminCancelBtn = document.getElementById('adminCancelBtn');
const adminCloseBtn = document.getElementById('adminCloseBtn');
const newBtnName = document.getElementById('newBtnName');
const newBtnBot = document.getElementById('newBtnBot');
const newBtnSite = document.getElementById('newBtnSite');
const newBtnColor = document.getElementById('newBtnColor');
const addBtnSubmit = document.getElementById('addBtnSubmit');
const manageBtnList = document.getElementById('manageBtnList');
const firebaseStatusNote = document.getElementById('firebaseStatusNote');

let editingId = null;

function resetForm(){
  editingId = null;
  newBtnName.value = '';
  newBtnBot.value = '';
  newBtnSite.value = '';
  newBtnColor.value = '#3742fa';
  addBtnSubmit.textContent = '➕ Tugma qoʻshish';
}

function startEdit(item){
  editingId = item.id;
  newBtnName.value = item.name;
  newBtnBot.value = item.bot === '#' ? '' : item.bot;
  newBtnSite.value = item.site === '#' ? '' : item.site;
  newBtnColor.value = item.color || '#3742fa';
  addBtnSubmit.textContent = '✏️ Yangilash';
  newBtnName.scrollIntoView({behavior:'smooth', block:'center'});
}

function moveItem(idx, dir){
  const newIdx = idx + dir;
  if (newIdx < 0 || newIdx >= currentButtons.length) return;
  const arr = currentButtons.slice();
  const tmp = arr[idx];
  arr[idx] = arr[newIdx];
  arr[newIdx] = tmp;
  saveButtons(arr);
}

function removeItem(id){
  saveButtons(currentButtons.filter(b => b.id !== id));
}

function renderManageList(){
  manageBtnList.innerHTML = '';
  if (!currentButtons.length){
    manageBtnList.innerHTML = '<p class="admin-note">Hozircha tugma yoʻq.</p>';
    return;
  }
  currentButtons.forEach((item, idx) => {
    const row = document.createElement('div');
    row.className = 'admin-list-row';

    const label = document.createElement('span');
    label.textContent = item.name;
    row.appendChild(label);

    const controls = document.createElement('div');
    controls.className = 'admin-row-controls';

    const upBtn = document.createElement('button');
    upBtn.className = 'admin-move-btn';
    upBtn.textContent = '↑';
    upBtn.disabled = idx === 0;
    upBtn.addEventListener('click', () => moveItem(idx, -1));

    const downBtn = document.createElement('button');
    downBtn.className = 'admin-move-btn';
    downBtn.textContent = '↓';
    downBtn.disabled = idx === currentButtons.length - 1;
    downBtn.addEventListener('click', () => moveItem(idx, 1));

    const editBtn = document.createElement('button');
    editBtn.className = 'admin-move-btn';
    editBtn.textContent = '✏️';
    editBtn.addEventListener('click', () => startEdit(item));

    const delBtn = document.createElement('button');
    delBtn.className = 'admin-del-btn';
    delBtn.textContent = '🗑';
    delBtn.addEventListener('click', () => removeItem(item.id));

    controls.appendChild(upBtn);
    controls.appendChild(downBtn);
    controls.appendChild(editBtn);
    controls.appendChild(delBtn);
    row.appendChild(controls);
    manageBtnList.appendChild(row);
  });
}

function openAdmin(){
  adminOverlay.classList.add('active');
  adminLoginBox.style.display = 'block';
  adminFormBox.style.display = 'none';
  adminPassInput.value = '';
  resetForm();
  if (firebaseStatusNote){
    firebaseStatusNote.textContent = firebaseReady
      ? 'Ulanish holati: Firebase orqali barcha tashrif buyuruvchilarga sinxronlanadi ✅'
      : 'Ulanish holati: Firebase sozlanmagan — oʻzgarishlar faqat shu brauzerda saqlanadi ⚠️';
  }
}
function closeAdmin(){ adminOverlay.classList.remove('active'); }

adminToggleBtn.addEventListener('click', openAdmin);
adminCancelBtn.addEventListener('click', closeAdmin);
adminCloseBtn.addEventListener('click', () => { resetForm(); closeAdmin(); });
adminOverlay.addEventListener('click', (e) => { if (e.target === adminOverlay) closeAdmin(); });

adminLoginBtn.addEventListener('click', () => {
  if (hashStr(adminPassInput.value) === ADMIN_PASSWORD_HASH){
    adminLoginBox.style.display = 'none';
    adminFormBox.style.display = 'block';
    renderManageList();
  } else {
    alert('Parol notoʻgʻri!');
  }
});

addBtnSubmit.addEventListener('click', () => {
  const name = newBtnName.value.trim();
  if (!name){ alert('Tugma nomini kiriting'); return; }
  const bot = newBtnBot.value.trim() || '#';
  const site = newBtnSite.value.trim() || '#';
  const color = newBtnColor.value;

  if (editingId){
    saveButtons(currentButtons.map(b => b.id === editingId ? { ...b, name, bot, site, color } : b));
  } else {
    const arr = currentButtons.slice();
    arr.push({ id: Date.now().toString(36), name, bot, site, color });
    saveButtons(arr);
  }
  resetForm();
});

initButtons();

/* Qor effekti */
function createSnow(){
  const s=document.createElement("div");
  s.className="snow";
  s.innerHTML="❄️";
  s.style.left=Math.random()*window.innerWidth+"px";
  s.style.fontSize=Math.random()*12+10+"px";
  s.style.animationDuration=Math.random()*5+5+"s";
  document.body.appendChild(s);
  setTimeout(()=>s.remove(),10000);
}
setInterval(createSnow,180);
</script>

</body>
</html>
