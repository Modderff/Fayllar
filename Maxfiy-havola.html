body {

  text-align: center;
}

.dark-bg {
  background: #000;
  min-height: 100vh;
}

h1 {
  margin-bottom: 20px;
  opacity: 0;
  animation: fadeInDown 1s forwards;
  font-size: 22px;
}

.buttons {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 15px;
}

a.button, button.button {
  display: inline-block;
  padding: 15px 30px;
  border-radius: 50px;
  font-size: 18px;
  color: white;
  text-decoration: none;
  font-weight: bold;
  position: relative;
  overflow: hidden;
  border: 2px solid transparent;
  transition: all 0.3s ease;
  cursor: pointer;
  opacity: 0;
  transform: translateY(20px);
  animation: fadeInUp 0.8s forwards;
  font-family: inherit;
}

/* ✨ Yulduzcha koʻrinishi */
a.button::after, button.button::after {
  content: "";
  position: absolute;
  top: -50%;
  left: -60%;
  width: 30%;
  height: 200%;
  background: rgba(255,255,255,0.35);
  transform: rotate(25deg);
  animation: starSweep 3.2s ease-in-out infinite;
  pointer-events: none;
}
@keyframes starSweep {
  0% { left: -60%; }
  50% { left: 130%; }
  100% { left: 130%; }
}

@keyframes fadeInUp {
  from{opacity:0;transform:translateY(20px)}
  to{opacity:1;transform:translateY(0)}
}
@keyframes fadeInDown {
  from{opacity:0;transform:translateY(-20px)}
  to{opacity:1;transform:translateY(0)}

.snow {
  position: fixed;
  top: -10px;
  color: white;
  pointer-events: none;
  z-index: 9999;
  animation: snowFall linear infinite;
}
@keyframes snowFall {
  to { transform: translateY(110vh); }
}

/* ===== MODAL (2 ta variant) ===== */

  justify-content: center;
  align-items: center;

.overlay.active { display: flex; }

.modal {

  border: 1px solid #333;
  border-radius: 16px;
  padding: 25px 20px;
  width: 85%;
  max-width: 320px;
  text-align: center;

.modal h3 {

.modal .opt {

  color: #999;
  font-weight: normal;

  margin-bottom: 0;

<div class="overlay" id="overlay">
  <div class="modal">
    <h3 id="modalTitle">Yuklab olish usulini tanlang</h3>
    <a href="#" id="optBot" class="opt opt-bot" target="_blank" rel="noopener">🤖 Bot orqali yuklash</a>
    <a href="#" id="optSite" class="opt opt-site" target="_blank" rel="noopener">🌐 Saytdan yuklash</a>
    <button class="opt opt-close" id="optClose">Bekor qilish</button>
  </div>
</div>

<script>
const overlay = document.getElementById('overlay');
const modalTitle = document.getElementById('modalTitle');
const optBot = document.getElementById('optBot');
const optSite = document.getElementById('optSite');
const optClose = document.getElementById('optClose');

/* Bosilganda tovush chiqarish */
let audioCtx;
function playClickSound(){
  try{
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(700, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(300, audioCtx.currentTime + 0.12);
    gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.15);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.15);
  }catch(e){}
}
document.addEventListener('click', (e) => {
  if (e.target.closest('.button, .social-btn, .opt')) playClickSound();
});

document.querySelectorAll('#buttons .button').forEach(btn => {
  btn.addEventListener('click', function () {
    const name = this.dataset.name || '';
    const bot = this.dataset.bot || '#';
    const site = this.dataset.site || '#';

    modalTitle.textContent = name ? (name + ' — yuklab olish usuli') : 'Yuklab olish usulini tanlang';
    optBot.href = bot;
    optSite.href = site;
    overlay.classList.add('active');
  });
});

optClose.addEventListener('click', () => overlay.classList.remove('active'));
overlay.addEventListener('click', (e) => {
  if (e.target === overlay) overlay.classList.remove('active');
});

/* Qor effekti */
function createSnow(){
  const s=document.createElement("div");
  s.className="snow";
  s.innerHTML="❄️";
  s.style.left=Math.random()*window.innerWidth+"px";
  s.style.fontSize=Math.random()*12+10+"px";
  s.style.animationDuration=Math.random()*5+5+"s";
  document.body.appendChild(s);
  setTimeout(()=>s.remove(),10000);
}
setInterval(createSnow,180);
</script>
